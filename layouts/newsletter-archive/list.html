{{ define "main" }}
<div class="container newsletter-list">
    <header class="page-header">
        <p class="subhead">The Science Talk</p>
        <h1>Newsletter Archives</h1>
        <p class="byline">Written by Dr. Pranoti Kshirsagar</p>
    </header>

    <ul class="newsletter-index">
        {{ range .Pages.ByDate.Reverse }}
        <li>
            <span class="newsletter-index-seq">{{ with .Params.sequence }}#{{ . }}{{ end }}</span>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
        </li>
        {{ end }}
    </ul>
</div>

<style>
.newsletter-list .page-header { padding: 5rem 0 2rem; text-align: center; }
.newsletter-list .subhead {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #ff5757;
    font-weight: 600;
    margin-bottom: 0.75rem;
}
.newsletter-list .page-header h1 {
    font-family: var(--font-display);
    font-size: clamp(2rem, 3.5vw, 2.8rem);
    color: #1c1c1c;
}
.newsletter-list .byline { color: #6f6f6f; margin-top: 0.5rem; }
.newsletter-index {
    list-style: none;
    max-width: 700px;
    margin: 0 auto 4rem;
    padding: 0 2.5rem;
}
.newsletter-index li {
    display: flex;
    align-items: baseline;
    gap: 0.9rem;
    padding: 0.9rem 0;
    border-bottom: 1px solid #ececec;
}
.newsletter-index-seq {
    color: #1c1c1c;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    min-width: 2.4rem;
}
.newsletter-index a { flex: 1; color: #1c1c1c; text-decoration: none; }
.newsletter-index a:hover { color: #ff5757; text-decoration: underline; }
.newsletter-index time { color: #999; white-space: nowrap; font-size: 0.9rem; }
</style>
{{ end }}
