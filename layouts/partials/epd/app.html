<script>
(function () {
  var CONFIG = window.EPD_CONFIG || {};
  var DATA_URL = CONFIG.dataUrl;
  var FILTER_KEYS = CONFIG.filterKeys || ['year', 'grant_type', 'domain'];
  var PAGE_SIZE = 24; // matches the server-rendered first page

  var LABELS = { year: 'Call Year', grant_type: 'Grant Scheme', domain: 'Domain' };
  // Display-only relabelling of scheme names; underlying data values are unchanged.
  var VALUE_LABELS = {
    'Starting Grants': 'Starting Grant',
    'Consolidator Grants': 'Consolidator Grant',
    'Advanced Grants': 'Advanced Grant',
    'Synergy Grants': 'Synergy Grant'
  };
  function valueLabel(v) { return VALUE_LABELS[v] || v; }

  // The data file stores only the Call code (ERC-2025-STG) and the Panel code
  // (LS1 - ... , or SYG-LS ... for Synergy). Call year, grant scheme and domain
  // are derived from those two, so there is one source of truth per project.
  var SCHEME_BY_CODE = {
    STG: 'Starting Grants',
    COG: 'Consolidator Grants',
    ADG: 'Advanced Grants',
    POC: 'Proof of Concept',
    SYG: 'Synergy Grants'
  };
  var DOMAIN_BY_CODE = {
    LS: 'Life Sciences (LS)',
    PE: 'Physical sciences & engineering (PE)',
    SH: 'Social sciences & humanities (SH)'
  };
  // Full panel names for the pill's hover text, from data/erc_panels.json, so the
  // 69-character names are not repeated 12,133 times in the project data.
  var PANEL_NAMES = {{ site.Data.erc_panels | jsonify | safeJS }};
  function derive(p) {
    var call = (p.call || '').split('-');           // ERC | 2025 | STG
    var panel = p.panel || '';
    var dkey = panel.indexOf('SYG-') === 0 ? panel.substr(4, 2) : panel.substr(0, 2);
    p.year = call[1] || '';
    p.grant_type = SCHEME_BY_CODE[call[2]] || '';
    p.domain = DOMAIN_BY_CODE[dkey] || '';
    // The data file stores the panel code only (LS1, PE8, SYG-LS). Synergy panels
    // carry no number, so their pill shows the domain alone: LS, PE, SH.
    p.panel_code = panel.indexOf('SYG-') === 0 ? dkey : panel;
    p.panel_name = PANEL_NAMES[panel] || panel;
    // One lowercased blob per project, built once, so a keystroke is a plain
    // substring scan rather than a re-lowercase of every field.
    p._s = (p.title + ' ' + p.acronym + ' ' + p.researcher + ' ' + p.host + ' ' +
            p.country + ' ' + p.panel_code + ' ' + p.call).toLowerCase();
    return p;
  }

  var DATA = [];

  function stripHost(h) {
    // Host field may list several institutions for multi-PI (Synergy) grants, each
    // tagged "[id,CC]". Drop the tags, the "Unknown Name" placeholder, and repeats.
    var parts = (h || '').replace(/\s*\[[^\]]*\]/g, '').split(',');
    var seen = {}, out = [];
    parts.forEach(function (p) {
      var n = p.trim();
      if (!n || n === 'Unknown Name' || seen[n]) return;
      seen[n] = true;
      out.push(n);
    });
    return out.join(', ');
  }

  var TAXONOMIES = {};
  var FACET_COUNTS = {};
  FILTER_KEYS.forEach(function (k) { TAXONOMIES[k] = []; FACET_COUNTS[k] = {}; });

  function addUnique(list, val) { if (val && list.indexOf(val) === -1) list.push(val); }
  function buildTaxonomies() {
    DATA.forEach(function (p) {
      FILTER_KEYS.forEach(function (k) {
        addUnique(TAXONOMIES[k], p[k]);
        if (p[k]) FACET_COUNTS[k][p[k]] = (FACET_COUNTS[k][p[k]] || 0) + 1;
      });
    });
    FILTER_KEYS.forEach(function (k) {
      if (k === 'year') {
        TAXONOMIES[k].sort().reverse();
      } else {
        TAXONOMIES[k].sort(function (a, b) { return FACET_COUNTS[k][b] - FACET_COUNTS[k][a]; });
      }
    });
  }

  var state = {};
  FILTER_KEYS.forEach(function (k) { state[k] = []; });
  var page = 1;
  var collapsed = {};
  var query = '';        // raw text in the search box
  var queryTerms = [];   // lowercased words, all of which must match
  var queryTermRe = [];  // whole-token regex per term, or null for substring terms
  var PANEL_TERM = /^(ls|pe|sh)\d+$/;
  var focusSearch = false; // re-focus the box after a re-render

  function setQuery(v) {
    query = v;
    queryTerms = v.toLowerCase().split(/\s+/).filter(Boolean);
    queryTermRe = queryTerms.map(function (t) {
      return PANEL_TERM.test(t) ? new RegExp('(^|[^a-z0-9])' + t + '([^a-z0-9]|$)') : null;
    });
  }

  function toggleGroup(key) { collapsed[key] = !collapsed[key]; render(); }

  function parseUrl() {
    var p = new URLSearchParams(location.hash.replace(/^#/, ''));
    FILTER_KEYS.forEach(function (k) {
      var v = p.get(k);
      state[k] = v ? v.split(',') : [];
    });
    setQuery(p.get('q') || '');
    page = parseInt(p.get('page'), 10) || 1;
  }

  function writeUrl() {
    var p = new URLSearchParams();
    FILTER_KEYS.forEach(function (k) { if (state[k].length) p.set(k, state[k].join(',')); });
    if (query) p.set('q', query);
    if (page > 1) p.set('page', page);
    var qs = p.toString();
    var url = location.pathname + location.search + (qs ? '#' + qs : '');
    history.replaceState({}, '', url);
  }

  function toggleFilter(key, val) {
    var i = state[key].indexOf(val);
    if (i === -1) state[key].push(val); else state[key].splice(i, 1);
    page = 1;
    writeUrl();
    render();
  }

  function clearFilters() {
    FILTER_KEYS.forEach(function (k) { state[k] = []; });
    setQuery('');
    page = 1;
    writeUrl();
    render();
  }

  function matchesQuery(p) {
    for (var i = 0; i < queryTerms.length; i++) {
      var re = queryTermRe[i];
      // Panel-shaped terms match whole tokens only, so PE1 does not pull in
      // PE10 and PE11. Everything else stays a plain substring scan.
      if (re ? !re.test(p._s) : p._s.indexOf(queryTerms[i]) === -1) return false;
    }
    return true;
  }

  function matches(p) {
    for (var i = 0; i < FILTER_KEYS.length; i++) {
      var k = FILTER_KEYS[i];
      if (state[k].length && state[k].indexOf(p[k]) === -1) return false;
    }
    return matchesQuery(p);
  }

  function renderFilterGroup(key, options, pool) {
    var counts = {};
    pool.forEach(function (p) { if (p[key]) counts[p[key]] = (counts[p[key]] || 0) + 1; });
    var rows = options.map(function (o) {
      var checked = state[key].indexOf(o) !== -1 ? 'checked' : '';
      var count = counts[o] || 0;
      return '<label class="epd-filter-option">' +
        '<input type="checkbox" ' + checked + ' data-key="' + key + '" data-val="' + o.replace(/"/g, '&quot;') + '" class="epd-filter-input">' +
        (key === 'grant_type' ? valueLabel(o) : o) + '<span class="epd-count">' + count + '</span></label>';
    }).join('');
    var isCollapsed = collapsed[key] ? ' epd-collapsed' : '';
    return '<div class="epd-filter-group' + isCollapsed + '" data-group="' + key + '">' +
      '<h3 data-toggle-group="' + key + '">' + (LABELS[key] || key) + '<span class="epd-chevron">&#9660;</span></h3>' +
      '<div class="epd-filter-options">' + rows + '</div></div>';
  }

  function searchBox() {
    return '<div class="epd-searchbox">' +
      '<label class="epd-sr-only" for="epd-search">Search projects</label>' +
      '<input type="search" id="epd-search" class="epd-search-input" autocomplete="off" ' +
        'placeholder="Search by country, host institution, researcher, project title, panel" value="' +
        query.replace(/"/g, '&quot;') + '">' +
      (query ? '<button type="button" class="epd-search-clear" id="epd-search-clear" aria-label="Clear search">&times;</button>' : '') +
      '</div>';
  }

  function activeChips() {
    var chips = [];
    if (query) {
      chips.push('<span class="epd-chip">\u201c' + query.replace(/</g, '&lt;') +
        '\u201d<span class="epd-x" data-chip-search="1">\u00d7</span></span>');
    }
    FILTER_KEYS.forEach(function (key) {
      state[key].forEach(function (val) {
        chips.push('<span class="epd-chip">' + (key === 'grant_type' ? valueLabel(val) : val) +
          '<span class="epd-x" data-chip-key="' + key + '" data-chip-val="' + val.replace(/"/g, '&quot;') + '">×</span></span>');
      });
    });
    if (!chips.length) return '';
    return '<div class="epd-active-chips">' + chips.join('') + '</div>';
  }

  function card(p) {
    var tags = '<span class="epd-tag">' + p.year + '</span>';
    if (FILTER_KEYS.indexOf('grant_type') !== -1 && p.grant_type) {
      tags += '<span class="epd-tag">' + valueLabel(p.grant_type) + '</span>';
    } else if (p.domain) {
      tags += '<span class="epd-tag">' + p.domain + '</span>';
    }
    if (p.panel_code) {
      tags += '<span class="epd-tag epd-tag-panel" title="' + p.panel_name + '">' + p.panel_code + '</span>';
    }
    return '<div class="epd-card">' +
      '<span class="epd-acronym">' + p.acronym + '</span>' +
      '<h4>' + p.title + '</h4>' +
      '<div class="epd-meta">' +
        '<strong>' + p.researcher + '</strong><br>' +
        stripHost(p.host) + (p.country ? ', ' + p.country : '') +
      '</div>' +
      '<div class="epd-tags">' + tags + '</div>' +
      '<div class="epd-links"><a href="' + p.cordis + '" target="_blank" rel="noopener">View on CORDIS</a></div>' +
      '</div>';
  }

  function pagination(totalPages) {
    if (totalPages <= 1) return '';
    var btns = [];
    btns.push('<button class="epd-page-btn epd-page-arrow" id="epd-prev"' + (page <= 1 ? ' disabled' : '') + ' aria-label="Previous page">&larr;</button>');
    btns.push('<span class="epd-page-status">Page ' + page + ' of ' + totalPages + '</span>');
    btns.push('<button class="epd-page-btn epd-page-arrow" id="epd-next"' + (page >= totalPages ? ' disabled' : '') + ' aria-label="Next page">&rarr;</button>');
    return '<div class="epd-pagination">' + btns.join('') + '</div>';
  }

  function render() {
    var results = DATA.filter(matches);
    var totalPages = Math.max(1, Math.ceil(results.length / PAGE_SIZE));
    if (page > totalPages) page = totalPages;
    var pageResults = results.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
    var hasActive = !!query || FILTER_KEYS.some(function (k) { return state[k].length; });

    // Facet counts reflect the search, so a count never promises more than the
    // search can deliver. They ignore the other facets, as they did before.
    var pool = queryTerms.length ? DATA.filter(matchesQuery) : DATA;
    var filterGroups = FILTER_KEYS.map(function (k) { return renderFilterGroup(k, TAXONOMIES[k], pool); }).join('');

    document.getElementById('epd-app').innerHTML =
      '<div class="epd-layout">' +
        '<aside class="epd-filters">' +
          '<div class="epd-filters-scroll">' + filterGroups + '</div>' +
          '<button class="epd-clear-filters' + (hasActive ? ' epd-active' : '') + '" id="epd-clear">Clear all filters</button>' +
        '</aside>' +
        '<div class="epd-results-col" style="flex:1">' +
          searchBox() +
          '<div class="epd-results-header">' +
            '<div class="epd-results-count">' + results.length + ' project' + (results.length === 1 ? '' : 's') + '</div>' +
          '</div>' +
          activeChips() +
          (pageResults.length ? '<div class="epd-results-grid">' + pageResults.map(card).join('') + '</div>' : '<div class="epd-no-results">' +
            (query ? 'No projects match \u201c' + query.replace(/</g, '&lt;') + '\u201d' +
                     (FILTER_KEYS.some(function (k) { return state[k].length; }) ? ' with the selected filters.' : '. Try a researcher name, an institution or a word from the project title.')
                   : 'No projects match the selected filters.') +
            '</div>') +
          pagination(totalPages) +
        '</div>' +
      '</div>';

    document.querySelectorAll('.epd-filter-input').forEach(function (input) {
      input.addEventListener('change', function () { toggleFilter(input.dataset.key, input.dataset.val); });
    });
    document.querySelectorAll('[data-toggle-group]').forEach(function (h3) {
      h3.addEventListener('click', function () { toggleGroup(h3.dataset.toggleGroup); });
    });
    document.querySelectorAll('.epd-x').forEach(function (x) {
      x.addEventListener('click', function () {
        if (x.dataset.chipSearch) { setQuery(''); page = 1; writeUrl(); render(); return; }
        toggleFilter(x.dataset.chipKey, x.dataset.chipVal);
      });
    });

    var searchEl = document.getElementById('epd-search');
    if (searchEl) {
      searchEl.addEventListener('input', function () {
        setQuery(searchEl.value);
        page = 1;
        focusSearch = true;
        writeUrl();
        render();
      });
      // render() replaces the whole block, so focus and caret are restored by hand.
      if (focusSearch) {
        focusSearch = false;
        searchEl.focus();
        var end = searchEl.value.length;
        try { searchEl.setSelectionRange(end, end); } catch (e) {}
      }
    }
    var searchClear = document.getElementById('epd-search-clear');
    if (searchClear) searchClear.addEventListener('click', function () {
      setQuery(''); page = 1; focusSearch = true; writeUrl(); render();
    });
    var clearBtn = document.getElementById('epd-clear');
    if (clearBtn) clearBtn.addEventListener('click', clearFilters);

    var prevBtn = document.getElementById('epd-prev');
    if (prevBtn) prevBtn.addEventListener('click', function () { page--; writeUrl(); render(); window.scrollTo({top: 0, behavior: 'smooth'}); });
    var nextBtn = document.getElementById('epd-next');
    if (nextBtn) nextBtn.addEventListener('click', function () { page++; writeUrl(); render(); window.scrollTo({top: 0, behavior: 'smooth'}); });
  }

  window.addEventListener('popstate', function () { if (DATA.length) { parseUrl(); render(); } });

  // Clicking the hero title clears every active filter and returns to page 1.
  var heroReset = document.getElementById('epd-hero-reset');
  if (heroReset) heroReset.addEventListener('click', function (e) {
    e.preventDefault();
    if (DATA.length) { clearFilters(); }
    else { history.replaceState({}, '', location.pathname); }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  var appEl = document.getElementById('epd-app');
  // Leave the server-rendered cards in place until the dataset loads and render() swaps them.
  fetch(DATA_URL)
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (json) {
      DATA = json.map(derive);
      buildTaxonomies();
      parseUrl();
      render();
    })
    .catch(function () {
      appEl.innerHTML = '<div class="epd-no-results">Could not load the project data — please refresh the page.</div>';
    });
})();
</script>
