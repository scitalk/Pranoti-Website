<header>
    <nav>
        <div class="container nav-container">
            <div class="nav-brand">
                <a href="/" class="brand-name">PRANOTI KSHIRSAGAR, PhD</a>
                {{ $path := .RelPermalink }}
                <ul class="nav-menu" id="nav-menu">
                    {{ range .Site.Menus.main }}
                    {{ $section := trim .URL "/" }}
                    {{ $isActive := and (ne .URL "/") (hasPrefix $path .URL) }}
                    <li><a href="{{ .URL }}" class="{{ if $isActive }}nav-active nav-active-{{ $section }}{{ end }}"{{ if $isActive }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
                    {{ end }}
                    <li><a href="/search/" class="nav-search-link" aria-label="Search">Search</a></li>
                </ul>
            </div>

            <button class="mobile-menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>
</header>
