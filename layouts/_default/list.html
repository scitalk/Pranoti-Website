{{ define "main" }}
<section class="container{{ if eq .Section "products" }} products-list{{ end }}">
    <header class="page-header">
        <h1>{{ .Title }}</h1>
        {{ with .Params.description }}
        <p class="description">{{ . }}</p>
        {{ end }}
    </header>
    
    <div class="posts-grid">
        {{ range .Pages }}
        <article class="post-card">
            <a href="{{ .Permalink }}">
                <h2>{{ .Title }}</h2>
                <p class="excerpt">{{ .Summary | truncate 150 }}</p>
                <time>{{ .Date.Format "January 2, 2006" }}</time>
            </a>
        </article>
        {{ end }}
    </div>
</section>

<style>
/* /products/ keeps its original look: Playfair headings, Montserrat body. */
.products-list { font-family: 'Montserrat', sans-serif; }
.products-list .page-header h1,
.products-list .post-card h2 { font-family: 'Playfair Display', serif; }

.page-header {
    padding: 5rem 0 2rem; /* Extra top padding for fixed header */
}

.page-header h1 {
    font-size: clamp(2rem, 3.5vw, 2.8rem);
    color: #1c1c1c;
    margin-bottom: 1rem;
}

.page-header .description {
    font-size: 1.125rem;
    color: #6f6f6f;
    max-width: 800px;
}

.posts-grid {
    display: grid;
    gap: 2.5rem;
    padding: 3rem 0;
}

.post-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 2rem;
    box-shadow: 0 2px 20px rgba(0,0,0,0.05);
    transition: all 0.3s ease;
}

.post-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 30px rgba(0,0,0,0.1);
}

.post-card a {
    text-decoration: none;
    color: #1c1c1c;
}

.post-card h2 {
    font-size: 1.75rem;
    margin-bottom: 1rem;
    color: #1c1c1c;
}

.post-card .excerpt {
    color: #6f6f6f;
    line-height: 1.6;
    margin-bottom: 1rem;
}

.post-card time {
    font-size: 0.9rem;
    color: #6f6f6f;
}

/* Mobile responsiveness */
@media (max-width: 768px) {
    .page-header {
        padding: 4rem 0 1.5rem; /* Adjusted for mobile fixed header */
    }
    
    .page-header h1 {
        font-size: 1.875rem;
    }
    
    .posts-grid {
        gap: 1.5rem;
        padding: 2rem 0;
    }
    
    .post-card {
        padding: 1.5rem;
    }
    
    .post-card h2 {
        font-size: 1.5rem;
    }
}
</style>
{{ end }}
