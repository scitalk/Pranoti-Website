# Testimonials — single source of truth for the /testimonials page and the
# About-page section. Mirrors the "Master Feedback & Testimonials" Google Sheet.
# Only entries marked "Yes" in the sheet's "Worth adding?" (column K) are included.
#
# To add a new one: copy a block below and fill it in.
#   name    – leave blank ("") for entries without documented name consent;
#             the card then shows the role + organisation only.
#   role    – job title (always safe to show)
#   org     – affiliation
#   context – service / event it relates to (small label on the card)
#   year    – for ordering / display
#   featured: true  – surfaces it in the curated set (homepage / top of page / About)
#
# Consent rule: entries with a real `name` have documented consent in the master
# sheet (column M). Entries with an empty `name` do not, and are shown
# anonymised (role + org only) — never their name.

testimonials:
